name: Build & Release

on:
  push:
    branches: [ main ]
    paths-ignore: [ "**.md" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Version festlegen
        run: |
          echo "VERSION_CODE=${{ github.run_number }}" >> $GITHUB_ENV
          echo "VERSION_NAME=1.0.${{ github.run_number }}" >> $GITHUB_ENV

      - name: Optionalen eigenen Signierschlüssel laden
        env:
          KS_B64: ${{ secrets.HOLOPIX_KEYSTORE_BASE64 }}
          KS_PW: ${{ secrets.HOLOPIX_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.HOLOPIX_KEY_ALIAS }}
          KS_KEYPW: ${{ secrets.HOLOPIX_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "HOLOPIX_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> $GITHUB_ENV
            echo "HOLOPIX_KEYSTORE_PASSWORD=$KS_PW" >> $GITHUB_ENV
            echo "HOLOPIX_KEY_ALIAS=$KS_ALIAS" >> $GITHUB_ENV
            echo "HOLOPIX_KEY_PASSWORD=$KS_KEYPW" >> $GITHUB_ENV
          fi

      - name: APK bauen
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: APK umbenennen
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/HOLOPIX-${VERSION_NAME}.apk"

      - name: GitHub Release erstellen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: HOLOPIX ${{ env.VERSION_NAME }}
          body: |
            Automatischer Build aus ${{ github.sha }}
            ${{ github.event.head_commit.message }}
          files: dist/*.apk
          make_latest: true
